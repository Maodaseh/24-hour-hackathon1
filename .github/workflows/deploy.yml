name: Deploy CrisisConnect

on:
  push:
    branches:
      - main
    paths:
      - "CrisisConnect/**"
      - ".github/workflows/deploy.yml"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::803760314287:role/CrisisConnectGitHubDeployRole
          aws-region: us-east-1

      - name: Deploy to EC2
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-096c6eea9b15121b4" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CrisisConnect from GitHub Actions" \
            --parameters 'commands=[
              "cd /home/ec2-user/24-hour-hackathon1",
              "git fetch origin main",
              "git reset --hard origin/main",
              "cd CrisisConnect",
              "npm ci",
              "pm2 restart crisisconnect --update-env",
              "pm2 save"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment..."

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-096c6eea9b15121b4" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Deployment failed!"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-096c6eea9b15121b4" \
                --query "StandardErrorContent" \
                --output text

              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out."
          exit 1
